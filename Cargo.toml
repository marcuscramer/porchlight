[workspace]
resolver = "2"
members = ["pake-bridge", "call-core"]

# Not a virtual-manifest-only workspace forever, necessarily — but for now
# neither member crate is published, and each keeps its own [package]
# section (version, edition) rather than inheriting from here.

[profile.release]
# Small binary matters more than link time here — both crates ship to a
# resource-constrained TV device and a browser download. Cargo only
# honors [profile.*] from a workspace's root, so this applies to every
# member crate uniformly rather than living in each one separately.
opt-level = "s"
lto = true

# Argon2 is the one place speed is deliberately a cost, and the one place it
# must still finish quickly on a weak TV chip and in a browser's WASM: always
# build it for speed, even in `cargo test`'s debug profile (otherwise every
# test that starts a pairing attempt would take seconds) and even under the
# release profile's size optimization.
[profile.dev.package.argon2]
opt-level = 3
[profile.release.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
